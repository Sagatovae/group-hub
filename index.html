<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ИДБ-26-09" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#626e45" />
    <meta name="description" content="Учебное пространство группы: объявления, предметы и материалы в одном месте." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%app-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-shapes.png" />
    <title>ИДБ-26-09 — учебное пространство</title>
    <style>
      #app-startup{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:24px;background:var(--canvas,#f7f8f5);color:var(--olive-900,#41482f);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .3s ease,visibility .3s ease}
      #app-startup.startup-finished{opacity:0;visibility:hidden;pointer-events:none}
      .startup-art{position:relative;display:grid;place-items:center;width:112px;height:112px}
      .startup-art::before,.startup-art::after{content:"";position:absolute;inset:0;border:1px solid var(--olive-200,#dbe2ce);border-radius:35%;animation:startup-orbit 9s linear infinite}
      .startup-art::after{inset:13px;border-color:var(--olive-300,#b7c39c);border-radius:50%;animation-direction:reverse;animation-duration:6s}
      .startup-core{width:36px;height:36px;background:var(--olive-500,#7b8455);border-radius:12px;box-shadow:0 0 0 12px var(--olive-100,#e9eddf);animation:startup-breathe 1.8s ease-in-out infinite}
      .startup-brand{font-size:27px;font-weight:750;letter-spacing:-.8px}.startup-brand span{color:var(--olive-500,#7b8455)}
      .startup-caption{display:flex;align-items:center;gap:9px;margin:0;color:var(--text-muted,#818870);font-size:12px}.startup-dots{display:flex;gap:4px}.startup-dots i{width:4px;height:4px;background:var(--olive-500,#7b8455);border-radius:50%;animation:startup-dot 1.2s ease-in-out infinite}.startup-dots i:nth-child(2){animation-delay:.15s}.startup-dots i:nth-child(3){animation-delay:.3s}
      @keyframes startup-orbit{to{transform:rotate(360deg)}}@keyframes startup-breathe{50%{transform:scale(.88);box-shadow:0 0 0 19px rgba(var(--olive-100-rgb,233,237,223),0.502)}}@keyframes startup-dot{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
      @media(prefers-reduced-motion:reduce){#app-startup,#app-startup *{animation:none!important;transition:none!important}#app-startup::before,#app-startup::after,.startup-art::before,.startup-art::after{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-startup" role="status" aria-label="Загружаем приложение">
      <div class="startup-art" aria-hidden="true"><span class="startup-core"></span></div>
      <div class="startup-brand" aria-hidden="true">ИДБ-2<span>6</span>-0<span>9</span></div>
      <p class="startup-caption" aria-hidden="true">Загружаем пространство<span class="startup-dots"><i></i><i></i><i></i></span></p>
    </div>
    <noscript><style>#app-startup{display:none}</style><p>Для работы приложения включите JavaScript в браузере.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
